<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>유흥 동문회 레크리에이션</title>
  <meta name="description" content="유흥 동문회 레크리에이션 진행용 페이지">
  <meta name="theme-color" content="#0f1020">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <style>
/* 유흥 동문회 레크리에이션 - 스타일 */
:root {
  --bg: #0f1020;
  --bg2: #161833;
  --card: #1d2046;
  --card2: #252957;
  --line: rgba(255, 255, 255, .12);
  --text: #f5f4ff;
  --muted: #aeacd0;
  --amber: #ffb84d;
  --pink: #ff6b8b;
  --mint: #4ee0b5;
  --sky: #5cc8ff;
  --danger: #ff5c6c;
  --radius: 20px;
  --bar-h: 58px;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --display: "Black Han Sans", var(--font);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--bar-h) + 8px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--text); line-height: 1.55;
  background:
    radial-gradient(900px 500px at 8% -5%, rgba(255, 107, 139, .18), transparent 60%),
    radial-gradient(800px 500px at 100% 20%, rgba(92, 200, 255, .13), transparent 60%),
    radial-gradient(900px 600px at 20% 100%, rgba(177, 140, 255, .14), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  word-break: keep-all;
}
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---------- 상단 바 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--bar-h);
  display: flex; align-items: center; gap: 14px; padding: 0 clamp(12px, 3vw, 28px);
  background: rgba(15, 16, 32, .82); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--display); font-size: 1.25rem; color: var(--amber); text-decoration: none; white-space: nowrap; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 6px 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  flex: none; padding: 6px 12px; border-radius: 999px; color: var(--muted);
  font-size: .9rem; font-weight: 600; text-decoration: none; transition: .15s;
}
.nav a:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
.nav a.on { color: #1a1300; background: var(--amber); }

/* ---------- 섹션 공통 ---------- */
.panel { padding: clamp(44px, 7vw, 88px) clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--line); }
.panel .inner { max-width: 1120px; margin: 0 auto; }
.sec-head { margin-bottom: clamp(22px, 3vw, 36px); }
.kicker { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.tag {
  font-size: .78rem; letter-spacing: .14em; font-weight: 800; padding: 4px 10px; border-radius: 6px;
  background: rgba(255, 184, 77, .16); color: var(--amber); border: 1px solid rgba(255, 184, 77, .4);
}
.no { font-size: .85rem; font-weight: 800; letter-spacing: .12em; color: var(--pink); }
h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 5.2vw, 3.6rem); line-height: 1.15; }
.sub { margin: 10px 0 0; font-size: clamp(1.05rem, 2vw, 1.4rem); color: var(--muted); }
h3 { margin: 0 0 12px; font-size: 1.15rem; }
.muted { color: var(--muted); font-size: .95rem; margin: 10px 0 0; }
.hint { color: var(--muted); font-size: .88rem; margin-top: 14px; }
.warn-text { color: var(--amber); }

.card {
  background: linear-gradient(160deg, var(--card), var(--bg2));
  border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 2.4vw, 28px);
  margin-bottom: 20px;
}
.card.center { text-align: center; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 0; }
.two-col > .card { margin-bottom: 20px; }
@media (max-width: 760px) { .two-col { grid-template-columns: minmax(0, 1fr); gap: 0; } }

.bullets { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 1.05rem; }
.bullets li { position: relative; padding-left: 20px; }
.bullets li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }

.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--amber)); margin-right: 8px; flex: none; vertical-align: -1px; }

/* ---------- 버튼 / 칩 ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, .06);
  padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: transform .1s, background .15s, opacity .15s;
  min-height: 44px;
}
.btn:hover { background: rgba(255, 255, 255, .12); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--amber); color: #1d1500; border-color: transparent; }
.btn.primary:hover { background: #ffc66d; }
.btn.accent { background: var(--pink); color: #2a0510; border-color: transparent; }
.btn.accent:hover { background: #ff849f; }
.btn.ok { background: var(--mint); color: #04251c; border-color: transparent; }
.btn.danger { background: transparent; color: var(--danger); border-color: rgba(255, 92, 108, .5); }
.btn.ghost { background: transparent; }
.btn.lg { padding: 14px 28px; font-size: 1.15rem; border-radius: 14px; min-height: 54px; }
.btn.sm { padding: 6px 12px; font-size: .88rem; min-height: 36px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.center .btn-row, .stage-card .btn-row { justify-content: center; }

.chipset { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none; cursor: pointer; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: .92rem;
  background: rgba(255, 255, 255, .06); border: 1px solid var(--line); min-height: 38px; display: inline-flex; align-items: center;
}
.chip[aria-pressed="true"] { background: var(--amber); color: #1d1500; border-color: transparent; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px #1d1500; }
.pill { display: inline-block; padding: 8px 18px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font-weight: 700; }
.pill.sm { padding: 3px 11px; font-size: .85rem; }
.lbl { font-size: .82rem; font-weight: 700; color: var(--muted); margin: 0 0 6px; letter-spacing: .04em; display: block; }

/* ---------- 인트로 ---------- */
.panel.intro { min-height: calc(100svh - var(--bar-h)); display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; }
.intro-inner { position: relative; z-index: 1; }
.intro .en { margin: 0; letter-spacing: .5em; color: var(--pink); font-weight: 800; font-size: clamp(.9rem, 2vw, 1.2rem); padding-left: .5em; }
.intro h1 { margin: 10px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(3.6rem, 15vw, 9rem); line-height: 1.05; color: var(--text); text-shadow: 0 6px 0 rgba(255, 107, 139, .5), 0 0 60px rgba(255, 184, 77, .35); }
.tagline { margin: 18px 0 24px; font-size: clamp(1.1rem, 2.6vw, 1.7rem); color: var(--muted); }
.chips-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 32px; }
.orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; z-index: -1; }
.orb.o1 { width: 340px; height: 340px; background: var(--pink); left: -140px; top: -60px; }
.orb.o2 { width: 300px; height: 300px; background: var(--sky); right: -120px; top: 30%; }
.orb.o3 { width: 280px; height: 280px; background: #b18cff; left: 25%; bottom: -160px; }

/* ---------- 진행 순서 ---------- */
.agenda-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.agenda-card {
  appearance: none; text-align: left; cursor: pointer; display: grid; gap: 4px; padding: 18px 20px;
  background: linear-gradient(160deg, var(--card), var(--bg2)); border: 1px solid var(--line); border-radius: 16px; transition: .15s;
}
.agenda-card:hover { transform: translateY(-3px); border-color: var(--amber); }
.agenda-card .num { font-family: var(--display); font-size: 1.9rem; color: var(--amber); line-height: 1; }
.agenda-card .t { font-weight: 800; font-size: 1.1rem; }
.agenda-card .m { color: var(--muted); font-weight: 600; font-size: .92rem; }

/* ---------- 팀 ---------- */
.team-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 14px; }
.team-card { display: flex; align-items: center; gap: 0; padding: 8px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); border-left: 6px solid var(--c); }
.team-card input { flex: 1; min-width: 0; background: transparent; border: 0; font-weight: 800; font-size: 1.15rem; padding: 6px 4px; }
.team-card .size { color: var(--muted); font-weight: 700; }
.team-card .dot { margin-right: 6px; }

/* ---------- 노래 퀴즈 ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin: 4px 0 16px; }
.round-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 20px; }
.round { background: linear-gradient(160deg, var(--card), var(--bg2)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; align-content: start; }
.round header { display: flex; align-items: center; gap: 8px; }
.round .q { font-family: var(--display); font-size: 1.5rem; color: var(--amber); margin-right: 4px; }
.round .yr { margin-left: auto; color: var(--muted); font-size: .9rem; font-weight: 600; }
.round audio { width: 100%; }
.round .player .muted { margin: 0; font-size: .85rem; }
.answers { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.lv { display: inline-block; padding: 2px 10px; border-radius: 6px; font-weight: 800; font-size: .85rem; background: rgba(255, 255, 255, .1); }
.lv-하 { background: rgba(78, 224, 181, .2); color: var(--mint); }
.lv-중 { background: rgba(255, 184, 77, .2); color: var(--amber); }
.lv-상 { background: rgba(255, 107, 139, .22); color: var(--pink); }
.lv-points { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- 점수 패드 ---------- */
.scorepad { background: rgba(255, 255, 255, .04); border: 1px dashed var(--line); border-radius: var(--radius); padding: 16px; margin-top: 20px; display: grid; gap: 8px; }
.pad-title { font-weight: 800; color: var(--muted); font-size: .9rem; letter-spacing: .04em; }
.sp-row { display: grid; grid-template-columns: minmax(90px, 1fr) 56px auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, .04); border-left: 5px solid var(--c); }
.sp-name { font-weight: 800; display: flex; align-items: center; }
.sp-val { font-family: var(--display); font-size: 1.7rem; text-align: center; font-variant-numeric: tabular-nums; }
.sp-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.sp-btns .btn { padding: 6px 12px; min-height: 40px; min-width: 46px; }
.sp-btns .plus { background: rgba(78, 224, 181, .18); color: var(--mint); border-color: rgba(78, 224, 181, .4); }
.sp-btns .minus { background: rgba(255, 92, 108, .12); color: var(--danger); border-color: rgba(255, 92, 108, .4); }

/* ---------- 점수판 표 ---------- */
.board-wrap { overflow-x: auto; }
table.board { width: 100%; border-collapse: separate; border-spacing: 0 6px; min-width: 520px; }
.board th, .board td { padding: 10px 8px; text-align: center; }
.board thead th { font-size: .82rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.board tbody th { text-align: left; font-weight: 800; white-space: nowrap; background: rgba(255, 255, 255, .05); border-radius: 12px 0 0 12px; border-left: 5px solid var(--c); padding-left: 14px; }
.board td { background: rgba(255, 255, 255, .05); }
.board td:last-child { border-radius: 0 12px 12px 0; }
.board input { width: 100%; max-width: 74px; text-align: center; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; font-weight: 700; font-variant-numeric: tabular-nums; }
.board .sum { font-family: var(--display); font-size: 1.5rem; color: var(--amber); }
.board .rank { font-weight: 900; font-size: 1.15rem; }
.board .rank.r1 { color: var(--amber); }
.board .rank.r1::after { content: " \1F451"; }

/* ---------- 타이머 ---------- */
.timer { display: grid; justify-items: center; gap: 14px; }
.time { font-family: var(--display); font-size: clamp(4rem, 14vw, 8.5rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.time.warn { color: var(--danger); animation: pulse .8s infinite; }
.time.done { color: var(--pink); }
.timer-btns, .presets { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
@keyframes pulse { 50% { opacity: .55; } }

/* ---------- 이심전심 ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: 1.05rem; }
.steps li { display: flex; gap: 12px; align-items: center; }
.steps .n { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: var(--amber); color: #1d1500; }
.stage-card { text-align: center; }
.stage-card h3 { text-align: left; }
.big-word { font-family: var(--display); font-size: clamp(3rem, 9vw, 5.5rem); line-height: 1.1; min-height: 1.2em; padding: 10px 0; color: var(--amber); word-break: keep-all; }
.countdown { font-family: var(--display); font-size: clamp(2rem, 6vw, 3.4rem); min-height: 1.3em; color: var(--pink); }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
.add-row { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
.add-row input, .winner-row input, .rou-side select, .rou-side textarea, .tel-row input {
  background: rgba(0, 0, 0, .28); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0;
}
.add-row input { flex: 1; max-width: 260px; }
.used { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }

/* ---------- 퍼즐 / 승자 ---------- */
.winner-row { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.winner-row label { font-weight: 800; color: var(--amber); }
.winner-row input { min-width: 220px; font-size: 1.1rem; }

/* ---------- 몸으로 말해요 ---------- */
.play-top { display: flex; flex-wrap: wrap; gap: 18px 32px; margin-bottom: 18px; align-items: flex-start; }
.play-main { display: grid; justify-items: center; gap: 16px; padding: 10px 0; }
.word-card { text-align: center; display: grid; gap: 12px; justify-items: center; width: 100%; }
.word-card .word { font-family: var(--display); font-size: clamp(2.6rem, 9vw, 5.6rem); line-height: 1.15; color: var(--amber); transition: filter .2s; padding: 4px 12px; }
.word-card.hide .word { filter: blur(22px); user-select: none; }
.play .time { font-size: clamp(3.4rem, 11vw, 6.5rem); }
.result { margin-top: 18px; text-align: center; padding: 18px; border-radius: 16px; background: rgba(78, 224, 181, .1); border: 1px solid rgba(78, 224, 181, .4); }
.big-num { font-family: var(--display); font-size: 4rem; color: var(--mint); line-height: 1; }
.big-num small { font-family: var(--font); font-size: 1.2rem; margin-left: 6px; font-weight: 800; }
.res-btn { margin-top: 12px; }
.play .btn-row { justify-content: center; }

/* ---------- 텔레파시 ---------- */
.formula-box { display: grid; gap: 4px; padding: 16px; border-radius: 14px; background: rgba(255, 184, 77, .1); border: 1px solid rgba(255, 184, 77, .4); font-size: 1.3rem; text-align: center; }
.formula-box strong { color: var(--amber); }
.ex { margin-top: 12px; font-size: 1rem; }
.ex p { margin: 6px 0; }
.tel-prompt { font-family: var(--display); font-size: clamp(2rem, 6vw, 3.2rem); color: var(--amber); line-height: 1.2; min-height: 1.2em; }
.tel-grid { display: grid; gap: 8px; }
.tel-row { display: grid; grid-template-columns: minmax(80px, 140px) 1fr 90px; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, .04); border-left: 5px solid var(--c); }
.tel-row .who { font-weight: 800; display: flex; align-items: center; }
.tel-row input { width: 100%; font-size: 1.05rem; }
.tel-row .out { text-align: right; font-weight: 800; }
.tel-row .out.gain { color: var(--mint); font-size: 1.2rem; }
.tel-row .out.dup { color: var(--muted); }
.tel-sum { margin-top: 14px; color: var(--muted); }
.tel-sum b { color: var(--amber); font-size: 1.2rem; }
.play .btn-row#telBtns { justify-content: flex-start; }

/* ---------- 보물찾기 ---------- */
.kind-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
.kind { padding: 22px; border-radius: 18px; text-align: center; background: linear-gradient(160deg, var(--card2), var(--bg2)); border: 1px solid var(--line); }
.k-name { color: var(--pink); font-weight: 800; letter-spacing: .06em; }
.k-desc { font-family: var(--display); font-size: 1.8rem; margin-top: 6px; }

/* ---------- 최종 발표 / 룰렛 ---------- */
.podium { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 8px; }
.pd { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; background: rgba(255, 255, 255, .05); border-left: 8px solid var(--c); animation: pop .5s ease-out; font-size: 1.25rem; }
.pd .rk { font-family: var(--display); font-size: 1.6rem; }
.pd .nm { font-weight: 800; display: flex; align-items: center; }
.pd .pt { font-family: var(--display); font-size: 1.6rem; color: var(--amber); }
.pd.r1 { background: linear-gradient(90deg, rgba(255, 184, 77, .3), rgba(255, 184, 77, .08)); font-size: 1.6rem; }
.rou-grid { display: grid; grid-template-columns: minmax(280px, 520px) 1fr; gap: 28px; align-items: center; }
@media (max-width: 860px) { .rou-grid { grid-template-columns: 1fr; } }
.wheel-box { position: relative; width: 100%; max-width: 520px; margin: 0 auto; }
.wheel-box canvas { width: 100%; height: auto; display: block; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 34px solid var(--amber); z-index: 2; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); }
.rou-side { display: grid; gap: 8px; }
.rou-side select, .rou-side textarea { width: 100%; }
.rou-side textarea { resize: vertical; line-height: 1.6; }
.rou-result { font-size: 1.3rem; min-height: 2.2em; margin-top: 8px; }
.rou-result strong { font-family: var(--display); font-size: 2.6rem; color: var(--amber); display: block; font-weight: 400; animation: pop .5s ease-out; }

/* ---------- 미션 / 마무리 ---------- */
.option { text-align: center; }
.opt-label { color: var(--pink); font-weight: 900; letter-spacing: .14em; }
.option p { font-size: 1.35rem; font-weight: 700; margin: 10px 0 0; }
.closing { margin-top: 48px; text-align: center; padding: 56px 16px; border-radius: 28px; background: linear-gradient(160deg, rgba(255, 107, 139, .25), rgba(92, 200, 255, .15)); border: 1px solid var(--line); }
.closing h2 { font-size: clamp(1.8rem, 5vw, 3rem); }
.closing .big { font-family: var(--display); font-size: clamp(2.6rem, 9vw, 5rem); color: var(--amber); margin: 12px 0 0; }
.closing .sub { margin: 6px 0 0; }
.closing .thanks { font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 22px 0 0; }

/* ---------- 플로팅 점수판 버튼 / 다이얼로그 ---------- */
.fab {
  position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40;
  appearance: none; border: 0; cursor: pointer; padding: 14px 22px; border-radius: 999px; font-weight: 900; font-size: 1rem;
  background: var(--pink); color: #2a0510; box-shadow: 0 8px 28px rgba(0, 0, 0, .5);
}
.fab:hover { background: #ff849f; }
dialog { width: min(760px, calc(100vw - 24px)); max-height: calc(100svh - 24px); overflow: auto; border: 1px solid var(--line); border-radius: 22px; background: var(--bg2); color: var(--text); padding: 22px; }

      "보물찾기 점수를 마지막으로 반영합니다.",
      "최종 우승 팀을 발표합니다."
    ],
    step2Title: "2. 꼴찌 팀 룰렛",
    step2: [
      "최하위 팀을 선정합니다.",
      "해당 팀원 중 룰렛으로 1명을 뽑습니다.",
      "당첨자는 동문회 후기/편지 작성 또는 유흥 유튜브 칭찬 댓글 미션을 수행합니다."
    ]
  },

  /* ---------- 12. 최종 미션 ---------- */
  mission: {
    title: "최종 미션 안내",
    subtitle: "벌칙보다는 동문회 기록을 남기는 미션으로!",
    tag: "MISSION",
    options: [
      { label: "OPTION A", text: "동문회 후기 및 선배님들께 드리는 편지 작성" },
      { label: "OPTION B", text: "유흥 유튜브 영상에 정성스러운 칭찬 댓글 작성" }
    ],
    notes: [
      "작성 기한과 분량은 회장단이 안내합니다.",
      "공식 계정 게시/댓글은 당사자와 회장단 확인 후 진행합니다."
    ]
  }
};

</script>
<script>
/* =====================================================================
 *  유흥 동문회 레크리에이션 - 동작 코드
 *  콘텐츠 수정은 js/data.js 에서 하세요. 이 파일은 보통 건드릴 필요 없습니다.
 * ===================================================================== */
(function () {
  'use strict';

  var D = window.RECREATION;
  if (!D) { document.body.innerHTML = '<p style="padding:2rem">data.js를 불러오지 못했습니다.</p>'; return; }

  /* ---------------------------------------------------------------
   *  유틸
   * ------------------------------------------------------------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  function el(html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function randInt(n) {
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = randInt(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function button(label, cls, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ' + (cls || ''); b.textContent = label;
    if (fn) b.addEventListener('click', fn);
    return b;
  }
  function list(items, cls) {
    return '<ul class="' + (cls || 'bullets') + '">' + items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(s) { return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
  function scrollToId(id) {
    var t = document.getElementById(id);
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------------------------------------------------------------
   *  상태 저장소 (점수 / 팀 이름) - localStorage
   * ------------------------------------------------------------- */
  var KEY = 'yuheung-recreation-v1';
  var Store = {
    s: { scores: {}, history: [], teamNames: {}, puzzleWinner: '' },
    subs: [],
    load: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var p = JSON.parse(raw);
          this.s.scores = p.scores || {};
          this.s.history = p.history || [];
          this.s.teamNames = p.teamNames || {};
          this.s.puzzleWinner = p.puzzleWinner || '';
        }
      } catch (e) { /* 저장소를 못 쓰는 환경이면 메모리로만 동작 */ }
    },
    save: function () { try { localStorage.setItem(KEY, JSON.stringify(this.s)); } catch (e) {} },
    on: function (fn) { this.subs.push(fn); },
    emit: function () { this.save(); this.subs.forEach(function (f) { f(); }); },
    get: function (game, i) { return Number((this.s.scores[game] || {})[i]) || 0; },
    add: function (game, i, delta, noHistory) {
      if (!delta) return;
      if (!this.s.scores[game]) this.s.scores[game] = {};
      this.s.scores[game][i] = this.get(game, i) + delta;
      if (!noHistory) {
        this.s.history.push({ game: game, team: i, delta: delta });
        if (this.s.history.length > 300) this.s.history.shift();
      }
      this.emit();
    },
    set: function (game, i, val) { this.add(game, i, (Number(val) || 0) - this.get(game, i)); },
    undo: function () {
      var h = this.s.history.pop();
      if (!h) return null;
      this.s.scores[h.game][h.team] = this.get(h.game, h.team) - h.delta;
      this.emit();
      return h;
    },
    reset: function () { this.s.scores = {}; this.s.history = []; this.emit(); },
    setName: function (i, name) {
      var n = String(name || '').trim();
      if (n) this.s.teamNames[i] = n; else delete this.s.teamNames[i];
      this.emit();
    },
    setPuzzleWinner: function (v) { this.s.puzzleWinner = v; this.save(); }
  };
  Store.load();

  function teamName(i) { return Store.s.teamNames[i] || D.teams[i].name; }
  function nameTag(i) { return '<span data-team-name="' + i + '">' + esc(teamName(i)) + '</span>'; }
  function refreshNames() {
    $$('[data-team-name]').forEach(function (n) { n.textContent = teamName(Number(n.getAttribute('data-team-name'))); });
  }
  Store.on(refreshNames);

  function totals(keys) {
    return D.teams.map(function (_, i) {
      return keys.reduce(function (sum, k) { return sum + Store.get(k, i); }, 0);
    });
  }
  function ranks(tot) {
    return tot.map(function (v) { return 1 + tot.filter(function (o) { return o > v; }).length; });
  }
  function teamMembers(i) {
    var t = D.teams[i];
    var named = (t.members || []).filter(Boolean);
    if (named.length) return named;
    var out = [];
    for (var k = 1; k <= t.size; k++) out.push(teamName(i) + ' ' + k + '번');
    return out;
  }

  /* ---------------------------------------------------------------
   *  소리 (타이머 종료 알림)
   * ------------------------------------------------------------- */
  var audioCtx = null;
  function beep(times) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      for (var k = 0; k < (times || 3); k++) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        o.connect(g); g.connect(audioCtx.destination);
        var t0 = audioCtx.currentTime + k * 0.35;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
        o.start(t0); o.stop(t0 + 0.27);
      }
    } catch (e) {}
  }

  /* ---------------------------------------------------------------
   *  타이머
   * ------------------------------------------------------------- */
  function createTimer(opts) {
    var total = opts.seconds, left = opts.seconds, id = null, endAt = 0;
    var api = {
      running: function () { return id !== null; },
      left: function () { return left; },
      render: function () {
        opts.display.textContent = fmtTime(left);
        opts.display.classList.toggle('warn', left <= 10 && left > 0);
        opts.display.classList.toggle('done', left === 0);
      },
      start: function () {
        if (id !== null || left <= 0) return;
        try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        endAt = Date.now() + left * 1000;
        id = setInterval(function () {
          left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
          api.render();
          if (left <= 0) { clearInterval(id); id = null; beep(3); if (opts.onEnd) opts.onEnd(); if (opts.onState) opts.onState(); }
        }, 200);
        if (opts.onState) opts.onState();
      },
      pause: function () {
        if (id === null) return;
        left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
        clearInterval(id); id = null; api.render();
        if (opts.onState) opts.onState();
      },
      reset: function (sec) {
        if (id !== null) { clearInterval(id); id = null; }
        if (sec != null) total = sec;
        left = total; api.render();
        if (opts.onState) opts.onState();
      }
    };
    api.render();
    return api;
  }

  /* 시작/일시정지/리셋 + 프리셋 버튼이 달린 기본 타이머 */
  function timerUI(root, cfg) {
    root.classList.add('timer');
    root.innerHTML =
      '<div class="time" aria-live="off">00:00</div>' +
      '<div class="timer-btns"></div>' +
      '<div class="presets"></div>';
    var display = $('.time', root), btns = $('.timer-btns', root), presets = $('.presets', root);
    var toggle;
    var timer = createTimer({
      display: display, seconds: cfg.defaultMinutes * 60,
      onState: function () { if (toggle) toggle.textContent = timer.running() ? '일시정지' : '시작'; }
    });
    toggle = button('시작', 'primary lg', function () { timer.running() ? timer.pause() : timer.start(); });
    btns.append(toggle, button('리셋', 'ghost', function () { timer.reset(); }));
    cfg.presetMinutes.forEach(function (m) {
      presets.append(button(m + '분', 'chip', function () {
        timer.reset(m * 60);
        $$('.chip', presets).forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
        this.setAttribute('aria-pressed', 'true');
      }));
    });
    var def = $$('.chip', presets).filter(function (c) { return c.textContent === cfg.defaultMinutes + '분'; })[0];
    if (def) def.setAttribute('aria-pressed', 'true');
    timer.render();
    return timer;
  }

  /* ---------------------------------------------------------------
   *  점수 입력 패드 (게임 섹션에 붙는 팀별 +/- 버튼)
   * ------------------------------------------------------------- */
  function scorePad(gameKey, steps, label) {
    var wrap = el('<div class="scorepad"><div class="pad-title">' + esc(label || '팀 점수') + '</div></div>');
    D.teams.forEach(function (t, i) {
      var row = el('<div class="sp-row" style="--c:' + esc(t.color) + '">' +
        '<span class="sp-name"><i class="dot"></i>' + nameTag(i) + '</span>' +
        '<span class="sp-val" data-val>0</span><span class="sp-btns"></span></div>');
      var b = $('.sp-btns', row);
      b.append(button('−1', 'minus', function () { Store.add(gameKey, i, -1); }));
      steps.forEach(function (s) { b.append(button('+' + s, 'plus', function () { Store.add(gameKey, i, s); })); });
      wrap.append(row);
    });
    function refresh() {
      $$('[data-val]', wrap).forEach(function (v, i) { v.textContent = Store.get(gameKey, i); });
    }
    Store.on(refresh); refresh();
    return wrap;
  }

  /* ---------------------------------------------------------------
   *  점수판 표
   * ------------------------------------------------------------- */
  function scoreboard(keys) {
    var games = D.scoreGames.filter(function (g) { return keys.indexOf(g.key) >= 0; });
    var html = '<div class="board-wrap"><table class="board"><thead><tr><th>팀</th>' +
      games.map(function (g) { return '<th>' + esc(g.label) + '</th>'; }).join('') +
      '<th>합계</th><th>순위</th></tr></thead><tbody>';
    D.teams.forEach(function (t, i) {
      html += '<tr style="--c:' + esc(t.color) + '"><th scope="row"><i class="dot"></i>' + nameTag(i) + '</th>';
      games.forEach(function (g) {
        html += '<td><input type="number" inputmode="numeric" step="1" data-game="' + g.key + '" data-team="' + i + '" aria-label="' +
          esc(t.name + ' ' + g.label) + ' 점수"></td>';
      });
      html += '<td class="sum" data-sum="' + i + '">0</td><td class="rank" data-rank="' + i + '">-</td></tr>';
    });
    html += '</tbody></table></div>';
    var root = el(html);
    $$('input', root).forEach(function (inp) {
      inp.addEventListener('change', function () {
        Store.set(inp.getAttribute('data-game'), Number(inp.getAttribute('data-team')), inp.value);
      });
    });
    function refresh() {
      $$('input', root).forEach(function (inp) {
        if (document.activeElement === inp) return;
        inp.value = Store.get(inp.getAttribute('data-game'), Number(inp.getAttribute('data-team')));
      });
      var tot = totals(keys), rk = ranks(tot);
      tot.forEach(function (v, i) {
        $('[data-sum="' + i + '"]', root).textContent = v;
        var r = $('[data-rank="' + i + '"]', root);
        r.textContent = rk[i];
        r.className = 'rank r' + rk[i];
      });
    }
    Store.on(refresh); refresh();
    return root;
  }

  /* ---------------------------------------------------------------
   *  공통 섹션 머리말
   * ------------------------------------------------------------- */
  function head(c) {
    return '<div class="sec-head">' +
      '<div class="kicker">' + (c.tag ? '<span class="tag">' + esc(c.tag) + '</span>' : '') +
      (c.no ? '<span class="no">' + esc(c.no) + '</span>' : '') + '</div>' +
      '<h2>' + esc(c.title) + '</h2>' +
      (c.subtitle ? '<p class="sub">' + esc(c.subtitle) + '</p>' : '') + '</div>';
  }

  /* ===============================================================
   *  섹션 정의
   * ============================================================= */
  var sections = [];
  function section(id, nav, build) { sections.push({ id: id, nav: nav, build: build }); }

  /* ---- 시작 ---- */
  section('intro', '시작', function (root) {
    root.classList.add('intro');
    root.innerHTML =
      '<div class="intro-inner">' +
      '<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>' +
      '<p class="en">' + esc(D.event.en) + '</p>' +
      '<h1>' + esc(D.event.title) + '</h1>' +
      '<p class="tagline">' + esc(D.event.tagline) + '</p>' +
      '<div class="chips-row">' + D.event.chips.map(function (c) { return '<span class="pill">' + esc(c) + '</span>'; }).join('') + '</div>' +
      '<div class="intro-cta"></div>' +
      '<p class="hint">키보드 ← / → 로 다음 순서로 이동할 수 있어요</p></div>';
    $('.intro-cta', root).append(button('시작하기', 'primary lg', function () { scrollToId('agenda'); }));
  });

  /* ---- 진행 순서 ---- */
  section('agenda', '순서', function (root) {
    var A = D.agenda;
    var total = A.items.reduce(function (s, it) { return s + it.minutes; }, 0);
    root.innerHTML = head(A) + '<div class="agenda-grid"></div>' +
      '<p class="hint">합계 ' + total + '분</p>';
    var grid = $('.agenda-grid', root);
    A.items.forEach(function (it, idx) {
      var card = el('<button type="button" class="agenda-card"><span class="num">' + pad2(idx + 1) + '</span>' +
        '<span class="t">' + esc(it.title) + '</span><span class="m">' + it.minutes + '분</span></button>');
      card.addEventListener('click', function () { scrollToId(it.to); });
      grid.append(card);
    });
  });

  /* ---- 팀 구성 ---- */
  section('teams', '팀 구성', function (root) {
    var T = D.teamIntro;
    root.innerHTML = head(T) +
      '<div class="two-col">' +
      '<div class="card"><h3>' + D.teams.length + '개 팀</h3><div class="team-grid"></div>' +
      '<p class="muted">' + esc(T.note1) + '</p><p class="muted">' + esc(T.note2) + ' (아래 칸에서 바로 수정)</p></div>' +
      '<div class="card"><h3>공통 규칙</h3>' + list(T.rules) + '</div></div>';
    var grid = $('.team-grid', root);
    D.teams.forEach(function (t, i) {
      var c = el('<label class="team-card" style="--c:' + esc(t.color) + '"><i class="dot"></i>' +
        '<input type="text" maxlength="14" value="' + esc(teamName(i)) + '" aria-label="' + esc(t.name) + ' 이름">' +
        '<span class="size">' + t.size + '명</span></label>');
      var inp = $('input', c);
      inp.addEventListener('change', function () { Store.setName(i, inp.value); inp.value = teamName(i); });
      grid.append(c);
    });
  });

  /* ---- GAME 01 노래 믹스 퀴즈 ---- */
  section('song', '노래 퀴즈', function (root) {
    var S = D.song;
    root.innerHTML = head(S) +
      '<div class="two-col">' +
      '<div class="card"><h3>진행 방법</h3>' + list(S.howTo) + '</div>' +
      '<div class="card"><h3>문제 구성 예시</h3>' + list(S.composition) +
      '<p class="muted">' + esc(S.pointNote) + '</p>' +
      '<div class="lv-points">' + Object.keys(S.levelPoints).map(function (k) {
        return '<span class="lv lv-' + esc(k) + '">' + esc(k) + ' ' + S.levelPoints[k] + '점</span>';
      }).join('') + '</div></div></div>' +
      '<div class="filters"><div class="chipset" data-f="year"></div><div class="chipset" data-f="level"></div>' +
      '<button type="button" class="btn ghost sm" id="songToggleAll">정답 모두 보기</button></div>' +
      '<div class="round-grid"></div><div class="pad-slot"></div>';

    var years = ['전체'].concat(S.rounds.map(function (r) { return r.year; }).filter(function (v, i, a) { return a.indexOf(v) === i; }));
    var levels = ['전체'].concat(Object.keys(S.levelPoints));
    var filt = { year: '전체', level: '전체' };
    function makeChips(kind, items) {
      var host = $('[data-f="' + kind + '"]', root);
      items.forEach(function (v) {
        var c = button(v, 'chip', function () {
          filt[kind] = v;
          $$('.chip', host).forEach(function (x) { x.setAttribute('aria-pressed', String(x === c)); });
          apply();
        });
        c.setAttribute('aria-pressed', String(v === '전체'));
        host.append(c);
      });
    }
    makeChips('year', years); makeChips('level', levels);

    var grid = $('.round-grid', root);
    S.rounds.forEach(function (r, idx) {
      var card = el('<article class="round" data-year="' + esc(r.year) + '" data-level="' + esc(r.level) + '">' +
        '<header><span class="q">Q' + (idx + 1) + '</span>' +
        '<span class="lv lv-' + esc(r.level) + '">' + esc(r.level) + '</span>' +
        '<span class="yr">' + esc(r.year) + '</span></header>' +
        '<div class="player"></div>' +
        '<button type="button" class="btn ghost sm reveal">정답 보기</button>' +
        '<ol class="answers" hidden>' + (r.songs || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol></article>');
      var player = $('.player', card);
      if (r.audio) {
        var a = document.createElement('audio');
        a.controls = true; a.preload = 'none'; a.src = r.audio;
        player.append(a);
        a.addEventListener('error', function () {
          player.innerHTML = '<p class="muted warn-text">음원 파일을 찾을 수 없어요: ' + esc(r.audio) + '</p>';
        });
      } else {
        player.innerHTML = '<p class="muted">음원 없음 - data.js 의 audio 경로를 채워주세요</p>';
      }
      var ans = $('.answers', card), rev = $('.reveal', card);
      rev.addEventListener('click', function () {
        ans.hidden = !ans.hidden;
        rev.textContent = ans.hidden ? '정답 보기' : '정답 숨기기';
      });
      grid.append(card);
    });
    function apply() {
      $$('.round', grid).forEach(function (c) {
        var ok = (filt.year === '전체' || c.getAttribute('data-year') === filt.year) &&
                 (filt.level === '전체' || c.getAttribute('data-level') === filt.level);
        c.hidden = !ok;
      });
    }
    var allOpen = false;
    $('#songToggleAll', root).addEventListener('click', function () {
      allOpen = !allOpen;
      $$('.round', grid).forEach(function (c) {
        $('.answers', c).hidden = !allOpen;
        $('.reveal', c).textContent = allOpen ? '정답 숨기기' : '정답 보기';
      });
      this.textContent = allOpen ? '정답 모두 숨기기' : '정답 모두 보기';
    });
    var steps = Object.keys(S.levelPoints).map(function (k) { return S.levelPoints[k]; })
      .filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(function (a, b) { return a - b; });
    $('.pad-slot', root).append(scorePad('song', steps, '노래 퀴즈 점수'));
  });

  /* ---- GAME 02 이심전심 ---- */
  section('simsim', '이심전심', function (root) {
    var S = D.simsim;
    root.innerHTML = head(S) +
      '<div class="two-col">' +
      '<div class="card"><h3>진행 순서</h3><ol class="steps">' +
      S.steps.map(function (t, i) { return '<li><span class="n">' + (i + 1) + '</span>' + esc(t) + '</li>'; }).join('') +
      '</ol><p class="muted">' + esc(S.note) + '</p></div>' +
      '<div class="card stage-card"><h3>제시어</h3>' +
      '<div class="big-word" id="simWord">?</div>' +

      ps.push({ x: cv.width / 2 + (Math.random() - 0.5) * 200, y: cv.height * 0.6,
        vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 18 - 6,
        s: 6 + Math.random() * 6, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
    }
    var t0 = performance.now();
    (function loop(now) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(function (p) {
        p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
      });
      if (now - t0 < 3600) requestAnimationFrame(loop);
      else { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
    })(t0);
  }

  /* ---------------------------------------------------------------
   *  페이지 조립
   * ------------------------------------------------------------- */
  document.title = D.event.title + ' ' + D.event.en;
  $('#brand').textContent = D.event.title;
  var app = $('#app'), nav = $('#nav');
  sections.forEach(function (s) {
    var node = document.createElement('section');
    node.id = s.id; node.className = 'panel'; node.setAttribute('data-sec', s.id);
    var inner = document.createElement('div'); inner.className = 'inner';
    node.append(inner); app.append(node);
    s.build(s.id === 'intro' ? node : inner);
    var a = document.createElement('a');
    a.href = '#' + s.id; a.textContent = s.nav; a.setAttribute('data-nav', s.id);
    nav.append(a);
  });

  /* 현재 위치 표시 */
  var current = 'intro';
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          current = e.target.id;
          $$('#nav a').forEach(function (a) {
            var on = a.getAttribute('data-nav') === current;
            a.classList.toggle('on', on);
            if (on) {
              var box = nav.getBoundingClientRect(), r = a.getBoundingClientRect();
              if (r.left < box.left || r.right > box.right) nav.scrollLeft += (r.left - box.left) - box.width / 3;
            }
          });
        }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    $$('.panel').forEach(function (p) { io.observe(p); });
  }

  /* 키보드 이동 */
  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
    var ids = sections.map(function (s) { return s.id; }), i = ids.indexOf(current);
    if (e.key === 'ArrowRight') { scrollToId(ids[Math.min(ids.length - 1, i + 1)]); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { scrollToId(ids[Math.max(0, i - 1)]); e.preventDefault(); }
  });

  /* 점수판 다이얼로그 */
  var dlg = $('#scoreDialog');
  $('#dlgBoard').append(scoreboard(D.scoreGames.map(function (g) { return g.key; })));
  $('#fab').addEventListener('click', function () { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); });
  $('#dlgClose').addEventListener('click', function () { dlg.close ? dlg.close() : dlg.removeAttribute('open'); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  $('#undoBtn').addEventListener('click', function () { Store.undo(); });
  $('#resetBtn').addEventListener('click', function () {
    if (window.confirm('모든 팀의 점수를 0으로 초기화할까요?')) Store.reset();
  });

  Store.emit();
})();

</script>
</body>
</html>

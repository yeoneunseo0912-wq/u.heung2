<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>유흥 동문회 레크리에이션</title>
  <meta name="description" content="유흥 동문회 레크리에이션 진행용 페이지">
  <meta name="theme-color" content="#0f1020">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <style>
/* 유흥 동문회 레크리에이션 - 스타일 (슬라이드 방식) */
:root {
  --bg: #0f1020;
  --bg2: #161833;
  --card: #1d2046;
  --card2: #252957;
  --line: rgba(255, 255, 255, .12);
  --text: #f5f4ff;
  --muted: #aeacd0;
  --amber: #ffb84d;
  --pink: #ff6b8b;
  --mint: #4ee0b5;
  --sky: #5cc8ff;
  --danger: #ff5c6c;
  --radius: 18px;
  --bar-h: 50px;
  /* 슬라이드 화면 비율 (PPT 16:9). 4:3으로 바꾸려면 --rw: 4; --rh: 3; */
  --rw: 16;
  --rh: 9;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --display: "Black Han Sans", var(--font);
}

* { box-sizing: border-box; }
html {
  font-size: clamp(14px, calc(0.85vh + 7px), 19px);
  height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%;
}
body {
  margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: var(--text); line-height: 1.5;
  background:
    radial-gradient(900px 500px at 8% -5%, rgba(255, 107, 139, .18), transparent 60%),
    radial-gradient(800px 500px at 100% 20%, rgba(92, 200, 255, .13), transparent 60%),
    radial-gradient(900px 600px at 20% 100%, rgba(177, 140, 255, .14), transparent 60%),
    var(--bg);
  word-break: keep-all;
}
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---------- 상단 바 ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: var(--bar-h);
  display: flex; align-items: center; gap: 14px; padding: 0 clamp(12px, 2.4vw, 28px);
  background: rgba(15, 16, 32, .88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--display); font-size: 1.2rem; color: var(--amber); text-decoration: none; white-space: nowrap; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 4px 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; padding: 5px 11px; border-radius: 999px; color: var(--muted); font-size: .86rem; font-weight: 600; text-decoration: none; transition: .15s; }
.nav a:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
.nav a.on { color: #1a1300; background: var(--amber); }

/* ---------- 슬라이드 ---------- */
#app {
  position: fixed; top: var(--bar-h); left: 0; right: 0; bottom: 0;
  container-type: size; display: grid; place-items: center;
  padding: 8px 10px 10px;
}
#stage {
  position: relative; overflow: hidden; container-type: size;
  width: min(100cqw, calc(100cqh * var(--rw) / var(--rh)));
  height: min(100cqh, calc(100cqw * var(--rh) / var(--rw)));
  border-radius: 20px; border: 1px solid var(--line);
  background:
    radial-gradient(70% 55% at 10% 0%, rgba(255, 107, 139, .14), transparent 70%),
    radial-gradient(60% 50% at 100% 30%, rgba(92, 200, 255, .10), transparent 70%),
    radial-gradient(70% 55% at 25% 100%, rgba(177, 140, 255, .12), transparent 70%),
    rgba(22, 24, 51, .55);
  box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
}
@media (max-aspect-ratio: 1/1), (max-width: 700px) {
  #app { padding: 0; }
  #stage { width: 100%; height: 100%; border-radius: 0; border: 0; }
}
.panel {
  display: none; position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding: clamp(10px, 2.2cqh, 28px) clamp(16px, 4cqw, 56px) 60px;
}
.panel.active { display: flex; animation: slide-in .38s cubic-bezier(.2, .8, .2, 1) both; }
.panel.from-left { --dx: -48px; }
.panel.from-right { --dx: 48px; }
@keyframes slide-in { from { opacity: 0; transform: translateX(var(--dx, 0)); } to { opacity: 1; transform: none; } }
.panel .inner { margin: auto; width: 100%; max-width: 1240px; }

.sec-head { margin-bottom: clamp(8px, 1.8cqh, 20px); }
.kicker { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.tag { font-size: .72rem; letter-spacing: .14em; font-weight: 800; padding: 3px 9px; border-radius: 6px; background: rgba(255, 184, 77, .16); color: var(--amber); border: 1px solid rgba(255, 184, 77, .4); }
.no { font-size: .8rem; font-weight: 800; letter-spacing: .12em; color: var(--pink); }
h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.8rem, 3.2cqw, 2.7rem); line-height: 1.15; }
.sub { margin: 6px 0 0; font-size: clamp(.95rem, 1.5cqw, 1.2rem); color: var(--muted); }
h3 { margin: 0 0 8px; font-size: 1.05rem; }
.muted { color: var(--muted); font-size: .9rem; margin: 8px 0 0; }
.hint { color: var(--muted); font-size: .82rem; margin: 10px 0 0; }
.warn-text { color: var(--amber); }

.card {
  background: linear-gradient(160deg, var(--card), var(--bg2));
  border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(12px, 1.9cqh, 22px) clamp(14px, 1.6cqw, 22px);
}
.card.center { text-align: center; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 14px; align-items: start; }
.cols.wide-left { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.side-col { display: grid; gap: 14px; align-content: start; min-width: 0; }
@media (max-width: 860px) {
  .two-col, .cols, .cols.wide-left { grid-template-columns: minmax(0, 1fr); }
}

.bullets { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 1rem; }
.bullets.tight { gap: 4px; font-size: .94rem; }
.bullets li { position: relative; padding-left: 18px; }
.bullets li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }

.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--c, var(--amber)); margin-right: 8px; flex: none; vertical-align: -1px; }

/* ---------- 버튼 / 칩 ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, .06);
  padding: 8px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: transform .1s, background .15s, opacity .15s; min-height: 40px;
}
.btn:hover { background: rgba(255, 255, 255, .12); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--amber); color: #1d1500; border-color: transparent; }
.btn.primary:hover { background: #ffc66d; }
.btn.accent { background: var(--pink); color: #2a0510; border-color: transparent; }
.btn.accent:hover { background: #ff849f; }
.btn.ok { background: var(--mint); color: #04251c; border-color: transparent; }
.btn.danger { background: transparent; color: var(--danger); border-color: rgba(255, 92, 108, .5); }
.btn.ghost { background: transparent; }
.btn.lg { padding: 11px 24px; font-size: 1.08rem; border-radius: 14px; min-height: 48px; }
.btn.sm { padding: 5px 12px; font-size: .85rem; min-height: 34px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.center .btn-row, .stage-card .btn-row, .play .btn-row { justify-content: center; }

.chipset { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; cursor: pointer; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: .88rem; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); min-height: 34px; display: inline-flex; align-items: center; }
.chip[aria-pressed="true"] { background: var(--amber); color: #1d1500; border-color: transparent; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px #1d1500; }
.pill { display: inline-block; padding: 7px 16px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font-weight: 700; }
.pill.sm { padding: 2px 10px; font-size: .8rem; }
.lbl { font-size: .78rem; font-weight: 700; color: var(--muted); margin: 0 0 5px; letter-spacing: .04em; display: block; }

/* ---------- 시작 ---------- */
.panel.intro { text-align: center; overflow: hidden; }
.panel.intro .intro-inner { margin: auto; position: relative; z-index: 1; }
.intro .en { margin: 0; letter-spacing: .5em; color: var(--pink); font-weight: 800; font-size: clamp(.9rem, 1.6cqw, 1.2rem); padding-left: .5em; }
.intro h1 { margin: 8px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(3.4rem, min(14cqw, 24cqh), 9rem); line-height: 1.05; text-shadow: 0 6px 0 rgba(255, 107, 139, .5), 0 0 60px rgba(255, 184, 77, .35); }
.tagline { margin: 14px 0 0; font-size: clamp(1.05rem, 2cqw, 1.6rem); color: var(--muted); }
.chips-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: clamp(18px, 4cqh, 36px) 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .45; z-index: 0; pointer-events: none; }
.orb.o1 { width: 36%; aspect-ratio: 1; background: var(--pink); left: -8%; top: -22%; }
.orb.o2 { width: 32%; aspect-ratio: 1; background: var(--sky); right: -8%; top: 30%; }
.orb.o3 { width: 30%; aspect-ratio: 1; background: #b18cff; left: 22%; bottom: -26%; }

/* ---------- 팀 구성 ---------- */
.team-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.team-tile { padding: clamp(18px, 4cqh, 40px) 20px; border-radius: 20px; background: linear-gradient(160deg, var(--card), var(--bg2)); border: 1px solid var(--line); border-top: 8px solid var(--c); text-align: center; }
.team-tile input { width: 100%; text-align: center; background: transparent; border: 0; border-bottom: 2px dashed transparent; font-family: var(--display); font-size: clamp(2rem, 6cqh, 3.2rem); padding: 4px; color: var(--c); }
.team-tile input:hover, .team-tile input:focus { border-bottom-color: var(--line); outline: none; }
.mem { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 4px; font-size: 1.1rem; font-weight: 600; }

/* ---------- 노래 퀴즈 ---------- */
.song-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
@media (max-width: 860px) { .song-grid { grid-template-columns: minmax(0, 1fr); } }
.now-card { text-align: center; display: grid; gap: 8px; align-content: center; }
.qno { font-weight: 800; letter-spacing: .1em; color: var(--muted); }
.now-main { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 2cqw, 28px); flex-wrap: wrap; }
.now-decade { font-family: var(--display); font-size: clamp(3rem, min(9cqw, 17cqh), 6.4rem); color: var(--amber); line-height: 1.05; }
.now-level { font-family: var(--display); font-size: clamp(2.6rem, min(7cqw, 13cqh), 5rem); width: 1.5em; height: 1.5em; display: grid; place-items: center; border-radius: 22px; line-height: 1; }
.now-pts { font-size: 1.25rem; color: var(--muted); }
.now-pts b { color: var(--mint); font-size: 1.6rem; }
.nav-row { justify-content: center; margin-top: 4px; }
.q-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.q-col { background: rgba(255, 255, 255, .04); border-radius: 12px; padding: 8px; }
.q-dec { font-weight: 800; font-size: .85rem; margin-bottom: 6px; }
.q-cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.q-cell { appearance: none; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; font-weight: 800; font-size: .92rem; background: rgba(255, 255, 255, .05); color: var(--muted); }
.q-cell.past { opacity: .45; }
.q-cell.on { background: var(--amber); color: #1d1500; border-color: transparent; opacity: 1; box-shadow: 0 0 0 3px rgba(255, 184, 77, .35); }
.lv { display: inline-block; padding: 2px 10px; border-radius: 6px; font-weight: 800; font-size: .85rem; background: rgba(255, 255, 255, .1); }
.lv-하 { background: rgba(78, 224, 181, .2); color: var(--mint); }
.lv-중 { background: rgba(255, 184, 77, .2); color: var(--amber); }
.lv-상 { background: rgba(255, 107, 139, .22); color: var(--pink); }
.q-cell.on.lv-하, .q-cell.on.lv-중, .q-cell.on.lv-상 { background: var(--amber); color: #1d1500; }

/* ---------- 점수 패드 ---------- */
.scorepad { background: rgba(255, 255, 255, .04); border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 6px; }
.pad-title { font-weight: 800; color: var(--muted); font-size: .82rem; letter-spacing: .04em; }
.sp-row { display: grid; grid-template-columns: minmax(70px, 1fr) 52px auto; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 12px; background: rgba(255, 255, 255, .04); border-left: 5px solid var(--c); }
.sp-name { font-weight: 800; display: flex; align-items: center; }
.sp-val { font-family: var(--display); font-size: 1.45rem; text-align: center; font-variant-numeric: tabular-nums; }
.sp-btns { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.sp-btns .btn { padding: 4px 9px; min-height: 36px; min-width: 44px; font-size: .92rem; }
.sp-btns .plus { background: rgba(78, 224, 181, .18); color: var(--mint); border-color: rgba(78, 224, 181, .4); }
.sp-btns .plus.suggest { background: var(--mint); color: #04251c; border-color: transparent; box-shadow: 0 0 0 3px rgba(78, 224, 181, .3); }

/* ---------- 점수판 표 ---------- */
.board-wrap { overflow-x: auto; }
table.board { width: 100%; border-collapse: separate; border-spacing: 0 5px; min-width: 480px; }
.board th, .board td { padding: 8px 6px; text-align: center; }
.board thead th { font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.board tbody th { text-align: left; font-weight: 800; white-space: nowrap; background: rgba(255, 255, 255, .05); border-radius: 12px 0 0 12px; border-left: 5px solid var(--c); padding-left: 12px; }
.board td { background: rgba(255, 255, 255, .05); }
.board td:last-child { border-radius: 0 12px 12px 0; }
.board input { width: 100%; max-width: 70px; text-align: center; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 8px; padding: 5px 2px; font-weight: 700; font-variant-numeric: tabular-nums; }
.board .sum { font-family: var(--display); font-size: 1.4rem; color: var(--amber); }
.board .rank { font-weight: 900; font-size: 1.1rem; }
.board .rank.r1 { color: var(--amber); }
.board .rank.r1::after { content: " \1F451"; }

/* ---------- 타이머 ---------- */
.timer { display: grid; justify-items: center; gap: 10px; }
.time { font-family: var(--display); font-size: clamp(3.4rem, min(12cqw, 20cqh), 7.5rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.time.warn { color: var(--danger); animation: pulse .8s infinite; }
.time.done { color: var(--pink); }
.timer-btns, .presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
@keyframes pulse { 50% { opacity: .55; } }

/* ---------- 이심전심 ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 1rem; }
.steps li { display: flex; gap: 10px; align-items: center; }
.steps .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .9rem; background: var(--amber); color: #1d1500; }
.stage-card { text-align: center; }
.stage-card h3 { text-align: left; }
.big-word { font-family: var(--display); font-size: clamp(2.6rem, min(9cqw, 14cqh), 5rem); line-height: 1.1; min-height: 1.15em; padding: 4px 0; color: var(--amber); }
.countdown { font-family: var(--display); font-size: clamp(1.8rem, min(5cqw, 8cqh), 3rem); min-height: 1.25em; color: var(--pink); }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
.add-row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.add-row input, .winner-row input, .rou-side select, .rou-side textarea, .tel-row input { background: rgba(0, 0, 0, .28); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.add-row input { flex: 1; max-width: 260px; }
.used { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 1.6em; }

/* ---------- 퍼즐 / 승자 ---------- */
.winner-row { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.winner-row label { font-weight: 800; color: var(--amber); }
.winner-row input { min-width: 220px; font-size: 1.05rem; }

/* ---------- 몸으로 말해요 ---------- */
.play-top { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-bottom: 10px; align-items: flex-start; }
.play-main { display: grid; justify-items: center; gap: 8px; padding: 4px 0; }
.word-card { text-align: center; display: grid; gap: 8px; justify-items: center; width: 100%; }
.word-card .word { font-family: var(--display); font-size: clamp(2.2rem, min(8cqw, 12cqh), 4.6rem); line-height: 1.15; color: var(--amber); transition: filter .2s; padding: 2px 10px; }
.word-card.hide .word { filter: blur(22px); user-select: none; }
.play .time { font-size: clamp(3rem, min(10cqw, 15cqh), 5.5rem); }
.result { margin-top: 12px; text-align: center; padding: 12px; border-radius: 16px; background: rgba(78, 224, 181, .1); border: 1px solid rgba(78, 224, 181, .4); }
.big-num { font-family: var(--display); font-size: 3rem; color: var(--mint); line-height: 1; }
.big-num small { font-family: var(--font); font-size: 1.1rem; margin-left: 6px; font-weight: 800; }
.res-btn { margin-top: 8px; }

/* ---------- 텔레파시 ---------- */
.formula-box { display: grid; gap: 2px; padding: 12px; border-radius: 14px; background: rgba(255, 184, 77, .1); border: 1px solid rgba(255, 184, 77, .4); font-size: 1.15rem; text-align: center; }
.formula-box strong { color: var(--amber); }
.ex { margin-top: 8px; font-size: .95rem; }
.ex p { margin: 4px 0; }
.tel-prompt { font-family: var(--display); font-size: clamp(1.8rem, 5cqh, 2.8rem); color: var(--amber); line-height: 1.2; min-height: 1.2em; }
.tel-grid { display: grid; gap: 6px; }
.tel-row { display: grid; grid-template-columns: minmax(70px, 120px) 1fr 84px; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 12px; background: rgba(255, 255, 255, .04); border-left: 5px solid var(--c); }
.tel-row .who { font-weight: 800; display: flex; align-items: center; }
.tel-row input { width: 100%; font-size: 1rem; }
.tel-row .out { text-align: right; font-weight: 800; }
.tel-row .out.gain { color: var(--mint); font-size: 1.1rem; }
.tel-row .out.dup { color: var(--muted); }
.tel-sum { margin-top: 10px; color: var(--muted); font-size: .92rem; }
.tel-sum b { color: var(--amber); font-size: 1.1rem; }

/* ---------- 보물찾기 ---------- */
.kind-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kind { padding: clamp(10px, 2cqh, 18px); border-radius: 16px; text-align: center; background: linear-gradient(160deg, var(--card2), var(--bg2)); border: 1px solid var(--line); }
.k-name { color: var(--pink); font-weight: 800; letter-spacing: .06em; }
.k-desc { font-family: var(--display); font-size: 1.55rem; margin-top: 4px; }

/* ---------- 최종 발표 / 룰렛 ---------- */
.podium { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.pd { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; background: rgba(255, 255, 255, .05); border-left: 8px solid var(--c); animation: pop .5s ease-out; font-size: 1.15rem; }
.pd .rk { font-family: var(--display); font-size: 1.45rem; }
.pd .nm { font-weight: 800; display: flex; align-items: center; }
.pd .pt { font-family: var(--display); font-size: 1.45rem; color: var(--amber); }

      { label: "OPTION B", text: "유흥 유튜브 가장 최신 영상에 아름다운 칭찬 댓글 작성", note: "" }

<script>
/* =====================================================================
 *  유흥 동문회 레크리에이션 - 동작 코드 (슬라이드 방식)
 *  콘텐츠 수정은 data.js 블록에서 하세요. 이 파일은 보통 건드릴 필요 없습니다.
 * ===================================================================== */
(function () {
  'use strict';

  var D = window.RECREATION;
  if (!D) { document.body.innerHTML = '<p style="padding:2rem">data.js를 불러오지 못했습니다.</p>'; return; }
  var UNIT = Number(D.scoreUnit) || 10;

  /* ---------------------------------------------------------------
   *  유틸
   * ------------------------------------------------------------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  function el(html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function randInt(n) {
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = randInt(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function button(label, cls, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ' + (cls || ''); b.textContent = label;
    if (fn) b.addEventListener('click', fn);
    return b;
  }
  function list(items, cls) {
    return '<ul class="' + (cls || 'bullets') + '">' + items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(s) { return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function animIn(node) {
    node.classList.remove('anim'); void node.offsetWidth; node.classList.add('anim');
  }

  /* ---------------------------------------------------------------
   *  상태 저장소 (점수 / 팀 이름 / 진행 위치) - localStorage
   * ------------------------------------------------------------- */
  var KEY = 'yuheung-recreation-v2';
  var Store = {
    s: { scores: {}, history: [], teamNames: {}, puzzleWinner: '', songIdx: 0 },
    subs: [],
    load: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var p = JSON.parse(raw);
          this.s.scores = p.scores || {};
          this.s.history = p.history || [];
          this.s.teamNames = p.teamNames || {};
          this.s.puzzleWinner = p.puzzleWinner || '';
          this.s.songIdx = Number(p.songIdx) || 0;
        }
      } catch (e) { /* 저장소를 못 쓰는 환경이면 메모리로만 동작 */ }
    },
    save: function () { try { localStorage.setItem(KEY, JSON.stringify(this.s)); } catch (e) {} },
    on: function (fn) { this.subs.push(fn); },
    emit: function () { this.save(); this.subs.forEach(function (f) { f(); }); },
    get: function (game, i) { return Number((this.s.scores[game] || {})[i]) || 0; },
    add: function (game, i, delta, noHistory) {
      if (!delta) return;
      if (!this.s.scores[game]) this.s.scores[game] = {};
      this.s.scores[game][i] = this.get(game, i) + delta;
      if (!noHistory) {
        this.s.history.push({ game: game, team: i, delta: delta });
        if (this.s.history.length > 300) this.s.history.shift();
      }
      this.emit();
    },
    set: function (game, i, val) { this.add(game, i, (Number(val) || 0) - this.get(game, i)); },
    undo: function () {
      var h = this.s.history.pop();
      if (!h) return null;
      this.s.scores[h.game][h.team] = this.get(h.game, h.team) - h.delta;
      this.emit();
      return h;
    },
    reset: function () { this.s.scores = {}; this.s.history = []; this.emit(); },
    setName: function (i, name) {
      var n = String(name || '').trim();
      if (n) this.s.teamNames[i] = n; else delete this.s.teamNames[i];
      this.emit();
    },
    setPuzzleWinner: function (v) { this.s.puzzleWinner = v; this.save(); },
    setSongIdx: function (v) { this.s.songIdx = v; this.save(); }
  };
  Store.load();

  function teamName(i) { return Store.s.teamNames[i] || D.teams[i].name; }
  function nameTag(i) { return '<span data-team-name="' + i + '">' + esc(teamName(i)) + '</span>'; }
  /* 텔레파시의 조 이름: "A팀" -> "A-1조" (팀 이름을 바꾸면 같이 바뀜) */
  function grpLabel(i, k) { return teamName(i).replace(/팀$/, '') + '-' + (k + 1) + '조'; }
  function grpTag(i, k) { return '<span data-grp="' + i + '-' + k + '">' + esc(grpLabel(i, k)) + '</span>'; }
  function refreshNames() {
    $$('[data-team-name]').forEach(function (n) { n.textContent = teamName(Number(n.getAttribute('data-team-name'))); });
    $$('[data-grp]').forEach(function (n) {
      var p = n.getAttribute('data-grp').split('-');
      n.textContent = grpLabel(Number(p[0]), Number(p[1]));
    });
  }
  Store.on(refreshNames);

  function totals(keys) {
    return D.teams.map(function (_, i) {
      return keys.reduce(function (sum, k) { return sum + Store.get(k, i); }, 0);
    });
  }
  function ranks(tot) {
    return tot.map(function (v) { return 1 + tot.filter(function (o) { return o > v; }).length; });
  }

  /* ---------------------------------------------------------------
   *  소리 (타이머 종료 알림)
   * ------------------------------------------------------------- */
  var audioCtx = null;
  function beep(times) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      for (var k = 0; k < (times || 3); k++) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        o.connect(g); g.connect(audioCtx.destination);
        var t0 = audioCtx.currentTime + k * 0.35;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
        o.start(t0); o.stop(t0 + 0.27);
      }
    } catch (e) {}
  }

  /* ---------------------------------------------------------------
   *  타이머
   * ------------------------------------------------------------- */
  function createTimer(opts) {
    var total = opts.seconds, left = opts.seconds, id = null, endAt = 0;
    var api = {
      running: function () { return id !== null; },
      left: function () { return left; },
      render: function () {
        opts.display.textContent = fmtTime(left);
        opts.display.classList.toggle('warn', left <= 10 && left > 0);
        opts.display.classList.toggle('done', left === 0);
      },
      start: function () {
        if (id !== null || left <= 0) return;
        try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        endAt = Date.now() + left * 1000;
        id = setInterval(function () {
          left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
          api.render();
          if (left <= 0) { clearInterval(id); id = null; beep(3); if (opts.onEnd) opts.onEnd(); if (opts.onState) opts.onState(); }
        }, 200);
        if (opts.onState) opts.onState();
      },
      pause: function () {
        if (id === null) return;
        left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
        clearInterval(id); id = null; api.render();
        if (opts.onState) opts.onState();
      },
      reset: function (sec) {
        if (id !== null) { clearInterval(id); id = null; }
        if (sec != null) total = sec;
        left = total; api.render();
        if (opts.onState) opts.onState();
      }
    };
    api.render();
    return api;
  }

  /* 시작/일시정지/리셋 타이머. cfg: { minutes, onEnd, onReset } */
  function timerUI(root, cfg) {
    root.classList.add('timer');
    root.innerHTML =
      '<div class="time" aria-live="off">00:00</div>' +
      '<div class="timer-btns"></div>';
    var display = $('.time', root), btns = $('.timer-btns', root);
    var toggle;
    var timer = createTimer({
      display: display, seconds: cfg.minutes * 60,
      onEnd: cfg.onEnd,
      onState: function () { if (toggle) toggle.textContent = timer.running() ? '일시정지' : '시작'; }
    });
    toggle = button('시작', 'primary lg', function () { timer.running() ? timer.pause() : timer.start(); });
    btns.append(toggle, button('리셋', 'ghost', function () { timer.reset(); if (cfg.onReset) cfg.onReset(); }));
    timer.render();
    return timer;
  }

  /* ---------------------------------------------------------------
   *  점수 입력 패드 (팀별 +10 / +20 ... 버튼)
   *  반환된 요소의 setHighlight(값) 으로 추천 점수 버튼을 강조할 수 있음
   * ------------------------------------------------------------- */
  function scorePad(gameKey, steps, label) {
    var wrap = el('<div class="scorepad">' + (label ? '<div class="pad-title">' + esc(label) + '</div>' : '') + '</div>');
    D.teams.forEach(function (t, i) {
      var row = el('<div class="sp-row" style="--c:' + esc(t.color) + '">' +
        '<span class="sp-name"><i class="dot"></i>' + nameTag(i) + '</span>' +
        '<span class="sp-val" data-val>0</span><span class="sp-btns"></span></div>');
      var b = $('.sp-btns', row);
      steps.forEach(function (s) {
        var pb = button('+' + s, 'plus', function () { Store.add(gameKey, i, s); });
        pb.setAttribute('data-step', s);
        b.append(pb);
      });
      wrap.append(row);
    });
    function refresh() {
      $$('[data-val]', wrap).forEach(function (v, i) { v.textContent = Store.get(gameKey, i); });
    }
    wrap.setHighlight = function (val) {
      $$('.plus', wrap).forEach(function (b) { b.classList.toggle('suggest', Number(b.getAttribute('data-step')) === val); });
    };
    Store.on(refresh); refresh();
    return wrap;
  }

  /* ---------------------------------------------------------------
   *  점수판 표 (직접 수정 가능)
   * ------------------------------------------------------------- */
  function scoreboard(keys) {
    var games = D.scoreGames.filter(function (g) { return keys.indexOf(g.key) >= 0; });
    var html = '<div class="board-wrap"><table class="board"><thead><tr><th>팀</th>' +
      games.map(function (g) { return '<th>' + esc(g.label) + '</th>'; }).join('') +
      '<th>합계</th><th>순위</th></tr></thead><tbody>';
    D.teams.forEach(function (t, i) {
      html += '<tr style="--c:' + esc(t.color) + '"><th scope="row"><i class="dot"></i>' + nameTag(i) + '</th>';
      games.forEach(function (g) {
        html += '<td><input type="number" inputmode="numeric" step="' + UNIT + '" data-game="' + g.key + '" data-team="' + i + '" aria-label="' +
          esc(t.name + ' ' + g.label) + ' 점수"></td>';
      });
      html += '<td class="sum" data-sum="' + i + '">0</td><td class="rank" data-rank="' + i + '">-</td></tr>';
    });
    html += '</tbody></table></div>';
    var root = el(html);
    $$('input', root).forEach(function (inp) {
      inp.addEventListener('change', function () {
        Store.set(inp.getAttribute('data-game'), Number(inp.getAttribute('data-team')), inp.value);
      });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') inp.blur(); });
    });
    function refresh() {
      $$('input', root).forEach(function (inp) {
        if (document.activeElement === inp) return;

    var shown = false;

  /* ================= GAME 04 텔레파시 ================= */
  /* answers: 조별 답변(팀 순서대로 A-1, A-2, B-1 ...). 점수 = (조 수 + 1 - 답 종류 수) x UNIT */
  function calcTelepathy(answers) {
    var norm = function (a) { return String(a || '').replace(/\s+/g, '').toLowerCase(); };
    var vals = answers.map(norm), counts = {}, kinds = 0;
    vals.forEach(function (v) { if (!v) return; if (!counts[v]) { counts[v] = 0; kinds++; } counts[v]++; });
    var base = answers.length + 1, pts = Math.max(0, base - kinds) * UNIT;
    return {
      base: base, kinds: kinds, pts: pts, counts: counts,
      per: vals.map(function (v) { return v && counts[v] === 1 ? pts : 0; }),
      dup: vals.map(function (v) { return v && counts[v] > 1; })
    };
  }
  section('telepathy', '텔레파시', function (root) {
    var T = D.telepathy, GROUPS = 2;
    var ex = calcTelepathy(T.exampleAnswers);
    var tally = {}, order = [];
    T.exampleAnswers.forEach(function (a) { if (!tally[a]) { tally[a] = 0; order.push(a); } tally[a]++; });
    order.sort(function (a, b) { return tally[b] - tally[a]; });
    var uniq = order.filter(function (a) { return tally[a] === 1; });
    var scoring =
      '<div class="formula-box"><strong>' + esc(T.formula[0]) + '</strong><span>' + esc(T.formula[1]) + '</span></div>' +
      list(T.scoringNotes, 'bullets tight') +
      '<div class="ex"><p class="muted">예시: ' + order.map(function (a) { return esc(a) + ' ' + tally[a] + '조'; }).join(' / ') + '</p>' +
      '<p>(' + ex.base + ' − ' + ex.kinds + '종류) × ' + UNIT + ' = <b>' + ex.pts + '점</b>' +
      (uniq.length ? ' (' + uniq.map(esc).join(', ') + ' 조 획득)' : '') + '</p></div>';
    infoSlide(root, T, { scoringHtml: scoring });
  });

  section('telepathy-play', null, function (root) {
    var T = D.telepathy, GROUPS = 2;
    root.innerHTML = head({ tag: T.tag, no: T.no, title: T.title }) +
      '<div class="cols wide-left">' +
      '<div class="card play"><div class="tel-grid" id="telGrid"></div><div class="tel-sum" id="telSum"></div>' +
      '<div class="btn-row" id="telBtns"></div></div>' +
      '<div class="pad-slot"></div></div>';

    var grid = $('#telGrid', root), sum = $('#telSum', root), btns = $('#telBtns', root);
    var inputs = [], outs = [], applied = false, lastRes = null;
    D.teams.forEach(function (t, i) {
      var row = el('<div class="tel-team" style="--c:' + esc(t.color) + '"><div class="tt-name"><i class="dot"></i>' + nameTag(i) + '</div></div>');
      for (var k = 0; k < GROUPS; k++) {
        var cell = el('<label class="tt-cell"><span class="tt-lab">' + grpTag(i, k) + '</span>' +
          '<input type="text" maxlength="20" placeholder="답변" autocomplete="off"><span class="out"></span></label>');
        inputs.push($('input', cell)); outs.push($('.out', cell));
        $('input', cell).addEventListener('input', function () { applied = false; recalc(); });
        row.append(cell);
      }
      grid.append(row);
    });
    function recalc() {
      lastRes = calcTelepathy(inputs.map(function (x) { return x.value; }));
      lastRes.per.forEach(function (p, e) {
        outs[e].textContent = !inputs[e].value.trim() ? '' : (lastRes.dup[e] ? '중복 0점' : '+' + p);
        outs[e].className = 'out ' + (lastRes.dup[e] ? 'dup' : (p ? 'gain' : ''));
      });
      var any = inputs.some(function (x) { return x.value.trim(); });
      var perTeam = D.teams.map(function (_, i) {
        var s = 0; for (var k = 0; k < GROUPS; k++) s += lastRes.per[i * GROUPS + k]; return s;
      });
      sum.innerHTML = any
        ? '(' + lastRes.base + ' − 서로 다른 답 ' + lastRes.kinds + '종류) × ' + UNIT + ' = <b>' + lastRes.pts + '점</b> (중복 없는 조만 획득)' +
          '<div class="team-gain">' + D.teams.map(function (_, i) { return nameTag(i) + ' <b>+' + perTeam[i] + '</b>'; }).join(' / ') + '</div>'
        : '조별 답변을 입력하면 점수가 자동 계산돼요.';
      applyBtn.disabled = !any || applied || !lastRes.per.some(function (p) { return p > 0; });
      applyBtn.textContent = applied ? '반영 완료' : '점수판에 반영';
    }
    var applyBtn = button('점수판에 반영', 'primary', function () {
      if (applied || !lastRes) return;
      lastRes.per.forEach(function (p, e) { if (p) Store.add('telepathy', Math.floor(e / GROUPS), p); });
      applied = true; recalc();
    });
    btns.append(applyBtn, button('다음 라운드 (입력 지우기)', 'ghost', function () {
      inputs.forEach(function (x) { x.value = ''; }); applied = false; recalc();
    }));
    $('.pad-slot', root).append(scorePad('telepathy', [10, 20, 30], '텔레파시 팀 점수'));
    recalc();
  });

  /* ================= 중간 집계 ================= */
  section('break', '중간 집계', function (root) {
    var B = D.breakTime;
    root.innerHTML = head(B) + '<div class="card board-card"><div class="board-slot"></div></div>';
    $('.board-slot', root).append(scoreboard(D.interimKeys));
  });

  /* ================= FINAL GAME 보물찾기 ================= */
  section('treasure', '보물찾기', function (root) {
    var T = D.treasure;
    root.innerHTML = head({ tag: T.tag, no: T.no, title: T.title }) +
      '<div class="kind-grid big">' + T.kinds.map(function (k) {
        return '<div class="kind"><div class="k-name">' + esc(k.name) + '</div><div class="k-desc">' + esc(k.desc) + '</div></div>';
      }).join('') + '</div><div class="start-row"></div>';
    $('.start-row', root).append(button('게임 시작 ›', 'primary lg', function () { go(cur + 1); }));
  });

  section('treasure-play', null, function (root) {
    var T = D.treasure;
    root.innerHTML = head({ tag: T.tag, no: T.no, title: T.title }) +
      '<div class="cols"><div class="card center"><div class="timer-slot"></div></div><div class="pad-slot"></div></div>';
    timerUI($('.timer-slot', root), { minutes: T.minutes });
    $('.pad-slot', root).append(scorePad('treasure', T.padSteps, '보물찾기 점수'));
  });

  /* ================= 최종 집계 ================= */
  section('final', '최종 집계', function (root) {
    var F = D.final;
    root.innerHTML = head({ tag: F.tag, title: F.title }) +
      '<div class="statements">' + F.statements.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</div>';
  });

  /* 점수가 도로록 올라가는 발표 화면 */
  function countUp(node, to, ms) {
    return new Promise(function (resolve) {
      var t0 = performance.now();
      (function f(now) {
        var p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3);
        node.textContent = Math.round(to * e);
        if (p < 1) requestAnimationFrame(f); else { node.textContent = to; resolve(); }
      })(t0);
    });
  }
  section('final-play', null, function (root) {
    var F = D.final;
    var html = '<div class="board-wrap"><table class="board reveal"><thead><tr><th>팀</th>' +
      D.scoreGames.map(function (g) { return '<th>' + esc(g.label) + '</th>'; }).join('') +
      '<th>합계</th><th>순위</th></tr></thead><tbody>';
    D.teams.forEach(function (t, i) {
      html += '<tr data-row="' + i + '" style="--c:' + esc(t.color) + '"><th scope="row"><i class="dot"></i>' + nameTag(i) + '</th>' +
        D.scoreGames.map(function (g) { return '<td data-g="' + g.key + '" data-t="' + i + '">–</td>'; }).join('') +
        '<td class="sum" data-sum="' + i + '">–</td><td class="rank" data-rk="' + i + '"></td></tr>';
    });
    html += '</tbody></table></div>';
    root.innerHTML = head({ tag: F.tag, title: F.title }) +
      '<div class="card reveal-card">' + html + '<div class="btn-row"></div></div>';

    var btn = button('점수 발표', 'primary lg', run);
    $('.btn-row', root).append(btn);
    var running = false;
    function cell(key, i) { return $('[data-g="' + key + '"][data-t="' + i + '"]', root); }
    function resetTable() {
      $$('td[data-g], td[data-sum]', root).forEach(function (c) { c.textContent = '–'; });
      $$('td[data-rk]', root).forEach(function (c) { c.textContent = ''; c.className = 'rank'; });
      $$('tr[data-row]', root).forEach(function (r) { r.classList.remove('first', 'last'); });
    }
    async function run() {
      if (running) return;
      running = true; btn.disabled = true; resetTable();
      var tot = totals(ALL_KEYS), rk = ranks(tot), maxRank = Math.max.apply(null, rk);
      for (var g = 0; g < D.scoreGames.length; g++) {
        var key = D.scoreGames[g].key;
        await Promise.all(D.teams.map(function (_, i) { return countUp(cell(key, i), Store.get(key, i), 1500); }));
        await wait(350);
      }
      await Promise.all(D.teams.map(function (_, i) { return countUp($('[data-sum="' + i + '"]', root), tot[i], 2600); }));
      await wait(500);
      D.teams.forEach(function (_, i) {
        var r = $('[data-rk="' + i + '"]', root);
        r.textContent = rk[i] + '위';
        r.className = 'rank r' + rk[i] + ' pop';
        var row = $('[data-row="' + i + '"]', root);
        if (rk[i] === 1) row.classList.add('first');
        if (rk[i] === maxRank && maxRank > 1) row.classList.add('last');
      });
      confetti();
      running = false; btn.disabled = false; btn.textContent = '다시 보기';
    }
  });

  /* ================= 최종 미션 ================= */
  section('mission', '최종 미션', function (root) {
    var M = D.mission;
    root.innerHTML = head({ tag: M.tag, title: M.title }) +
      '<div class="two-col mission-grid">' + M.options.map(function (o) {
        return '<div class="card option"><span class="opt-label">' + esc(o.label) + '</span><p>' + esc(o.text) + '</p>' +
          (o.note ? '<p class="opt-note">' + esc(o.note) + '</p>' : '') + '</div>';
      }).join('') + '</div>';
  });

  /* ================= 마무리 ================= */
  section('end', '마무리', function (root) {
    var E = D.event;
    root.classList.add('end');
    root.innerHTML = '<div class="closing"><p class="c-top">' + esc(E.closingTitle) + '</p>' +
      '<p class="big">' + esc(E.title) + '</p><p class="thanks">' + esc(E.closingThanks) + '</p></div>';
  });

  /* ---------------------------------------------------------------
   *  confetti (가벼운 캔버스 효과)
   * ------------------------------------------------------------- */
  function confetti() {
    var cv = $('#confetti'), ctx = cv.getContext('2d');
    cv.width = window.innerWidth; cv.height = window.innerHeight; cv.style.display = 'block';
    var cols = ['#ff6b8b', '#ffb84d', '#4ee0b5', '#5cc8ff', '#b18cff', '#fff'];
    var ps = [];
    for (var i = 0; i < 150; i++) {
      ps.push({ x: cv.width / 2 + (Math.random() - 0.5) * 200, y: cv.height * 0.6,
        vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 18 - 6,
        s: 6 + Math.random() * 6, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
    }
    var t0 = performance.now();
    (function loop(now) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(function (p) {
        p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
      });
      if (now - t0 < 3600) requestAnimationFrame(loop);
      else { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
    })(t0);
  }

  /* ---------------------------------------------------------------
   *  슬라이드 조립 / 페이지 넘기기
   * ------------------------------------------------------------- */
  document.title = D.event.title + ' ' + D.event.en;
  $('#brand').textContent = D.event.title;
  var app = $('#stage'), nav = $('#nav');

  /* 화면 비율: 슬라이드 영역은 css의 --rw : --rh 비율 상자 안에 들어가고,
   * 글자 크기(rem)는 그 상자 높이에 맞춰 조절됩니다. */
  function fitType() {
    var box = $('#app').getBoundingClientRect();
    var cs = getComputedStyle(document.documentElement);
    var rw = parseFloat(cs.getPropertyValue('--rw')) || 16, rh = parseFloat(cs.getPropertyValue('--rh')) || 9;
    var portrait = box.height > box.width;
    var h = portrait ? box.height : Math.min(box.height, box.width * rh / rw);
    document.documentElement.style.fontSize = Math.max(14, Math.min(19, 0.0085 * h + 7)) + 'px';
  }
  window.addEventListener('resize', fitType);
  fitType();
  var panels = [], cur = -1, navLinks = {};

  sections.forEach(function (s, i) {
    var node = document.createElement('section');
    node.id = s.id; node.className = 'panel'; node.setAttribute('data-sec', s.id);
    var inner = document.createElement('div'); inner.className = 'inner';
    node.append(inner); app.append(node);
    var onShow = s.build(s.id === 'intro' ? node : inner);
    panels.push({ id: s.id, node: node, group: s.group, onShow: typeof onShow === 'function' ? onShow : null });
    if (!navLinks[s.group.id]) {
      var a = document.createElement('a');
      a.href = '#' + s.group.id; a.textContent = s.group.label; a.setAttribute('data-nav', s.group.id);
      a.addEventListener('click', function (e) { e.preventDefault(); go(i); });
      nav.append(a);
      navLinks[s.group.id] = a;
    }
  });

  function go(i) {
    i = Math.max(0, Math.min(panels.length - 1, i));
    if (i === cur) return;
    var dir = i > cur ? 'from-right' : 'from-left';
    panels.forEach(function (p) { p.node.classList.remove('active', 'from-left', 'from-right'); });
    var p = panels[i];
    p.node.scrollTop = 0;
    p.node.classList.add('active', dir);
    cur = i;
    $$('#nav a').forEach(function (a) {
      var on = a.getAttribute('data-nav') === p.group.id;
      a.classList.toggle('on', on);
      if (on) {
        var box = nav.getBoundingClientRect(), r = a.getBoundingClientRect();
        if (r.left < box.left || r.right > box.right) nav.scrollLeft += (r.left - box.left) - box.width / 3;
      }
    });
    $('#pageNo').textContent = (i + 1) + ' / ' + panels.length;
    $('#prevBtn').disabled = i === 0;
    $('#nextBtn').disabled = i === panels.length - 1;
    try { history.replaceState(null, '', '#' + p.id); } catch (e) {}
    if (p.onShow) p.onShow();
  }

  $('#prevBtn').addEventListener('click', function () { go(cur - 1); });
  $('#nextBtn').addEventListener('click', function () { go(cur + 1); });
  $('#brand').addEventListener('click', function (e) { e.preventDefault(); go(0); });

  var dlg = $('#scoreDialog');
  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.ctrlKey || e.metaKey || e.altKey || dlg.open) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(cur - 1); e.preventDefault(); }
    else if (e.key === 'Home') { go(0); e.preventDefault(); }
    else if (e.key === 'End') { go(panels.length - 1); e.preventDefault(); }
  });

  /* 점수판 다이얼로그 */
  $('#dlgBoard').append(scoreboard(ALL_KEYS));
  $('#fab').addEventListener('click', function () { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); });
  $('#dlgClose').addEventListener('click', function () { dlg.close ? dlg.close() : dlg.removeAttribute('open'); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  $('#undoBtn').addEventListener('click', function () { Store.undo(); });
  $('#resetBtn').addEventListener('click', function () {
    if (window.confirm('모든 팀의 점수를 0으로 초기화할까요?')) Store.reset();
  });

  /* 시작 위치: 주소의 #id (새로고침 시 같은 페이지 유지) */
  var startId = (location.hash || '').replace('#', '');
  var startIdx = panels.map(function (p) { return p.id; }).indexOf(startId);
  go(startIdx >= 0 ? startIdx : 0);

  Store.emit();
})();

</script>
</body>
</html>
